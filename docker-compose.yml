# SkillBridge PH - local Docker stack
#
#   docker compose up -d --build   Full app at http://localhost:8080 + PostgreSQL
#   docker compose up -d db        PostgreSQL only, for `php artisan serve` against it
#   docker compose down            Stop (data is kept in volumes)
#   docker compose down -v         Stop AND delete the database and uploads
#
# The credentials below are for local development only. A deployed environment
# must set its own values through the host's environment settings.

name: skillbridgeph

services:
  app:
    build: .
    image: skillbridgeph:latest
    ports:
      - "8080:8080"
    env_file: .env            # supplies APP_KEY; the values below override it
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: skillbridge
      DB_USERNAME: skillbridge
      DB_PASSWORD: skillbridge
      SESSION_DRIVER: file
      CACHE_STORE: file
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/storage/app   # credential files survive rebuilds
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge -d skillbridge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
