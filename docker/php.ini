; SkillBridge PH - PHP runtime settings for the container.

; Credential uploads allow documents up to 10 MB and demo videos up to 60 MB.
; The PHP defaults (2 MB / 8 MB) would reject them before the app ever sees them.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 60

; OPcache: compile the application once instead of on every request.
; validate_timestamps = 0 is correct for an immutable image - code never changes
; at runtime. Rebuild the image to ship code changes.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
